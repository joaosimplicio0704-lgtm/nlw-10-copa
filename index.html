<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IA do zero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="brand"><div class="dot"></div> IA do zero</div>
    <p>rede neural + parser de código + analisador estático. tudo escrito do zero, sem biblioteca externa.</p>
  </header>

  <div class="search-wrap">
    <input type="text" class="search-bar" id="snippetInput"
      placeholder="cole um trecho de código JavaScript…"
      value="function init() { for (let i = 0; i < n; i++) { if (ok) { return i; } } }" />
  </div>

  <nav class="tabs">
    <button class="tab active" data-view="view-train">treino</button>
    <button class="tab" data-view="view-analyze">analisar código</button>
    <button class="tab" data-view="view-net">rede neural</button>
    <button class="tab" data-view="view-conf">confiança</button>
  </nav>

  <main>
    <!-- treino -->
    <section class="panel-view active" id="view-train">
      <div class="panel">
        <div class="row">
          <button id="trainBtn">treinar (contínuo)</button>
          <button id="stepBtn">treinar 10 épocas</button>
          <button id="resetBtn">resetar rede</button>
          <button id="saveBtn">salvar modelo</button>
          <button id="loadBtn">carregar modelo</button>
        </div>
        <div class="stats">
          <span class="stat-item"><span class="stat-dot"></span> épocas: <b id="epoch">0</b></span>
          <span class="stat-item">erro: <b id="error">-</b></span>
        </div>
        <canvas id="chart" width="700" height="200"></canvas>
      </div>

      <div class="panel" style="margin-top:14px">
        <label style="display:block;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.05em;text-transform:uppercase">heatmap de pesos por camada</label>
        <div class="row compact" style="align-items:flex-start">
          <select id="layerSelect">
            <option value="0">oculta 1 (16×16)</option>
            <option value="1">oculta 2 (16×16)</option>
            <option value="2">saída (4×16)</option>
          </select>
          <canvas id="heatCanvas" width="340" height="180" style="margin-left:12px"></canvas>
        </div>
      </div>
    </section>

    <!-- analisar código -->
    <section class="panel-view" id="view-analyze">
      <div class="panel">
        <label>trecho de código JavaScript</label>
        <textarea id="codeInput" rows="6">function soma(a, b) {
  if (a > 0) {
    return a + b;
  }
  return 0;
}</textarea>
        <div class="row">
          <button id="predictBtn">prever classe (rede)</button>
          <button id="analyzeBtn">analisar estático</button>
        </div>
        <div id="result" class="result-empty">--</div>
        <div id="confidence" class="confidence"></div>
        <div id="analysisOutput" class="analysis-output"></div>
      </div>
    </section>

    <!-- rede neural -->
    <section class="panel-view" id="view-net">
      <div class="panel net-panel">
        <canvas id="netCanvas" width="720" height="340"></canvas>
      </div>
    </section>

    <!-- confiança -->
    <section class="panel-view" id="view-conf">
      <div class="panel">
        <label>saída da rede (probabilidades por classe)</label>
        <div id="confidence2" class="confidence"></div>
        <canvas id="confCanvas" width="340" height="220"></canvas>
      </div>
    </section>

    <!-- log -->
    <section class="panel">
      <span class="log-label">log</span>
      <div id="log" class="log"></div>
    </section>
  </main>

  <footer>
    camadas: 16 → 16 → 16 → 4 &nbsp;|&nbsp; ativação: sigmoid &nbsp;|&nbsp; otimizador: Adam &nbsp;|&nbsp; entrada: 16 features reais do parser &nbsp;|&nbsp; pesos persistidos em JSON no localStorage
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
